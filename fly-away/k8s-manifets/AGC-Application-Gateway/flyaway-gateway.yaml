apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: flyaway-gateway
  namespace: default
  annotations:
    alb.networking.azure.io/alb-namespace: alb-infra
    alb.networking.azure.io/alb-name: flyaway-alb
spec:
  gatewayClassName: azure-alb-external
  listeners:
    - name: http-listener
      hostname: flyaway.capclouds.com
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

    - name: https-listener
      hostname: flyaway.capclouds.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: flyaway-tls
      allowedRoutes:
        namespaces:
          from: Same