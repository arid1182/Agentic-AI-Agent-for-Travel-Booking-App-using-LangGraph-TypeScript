apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flyaway-http-redirect
  namespace: default
spec:
  parentRefs:
    - name: flyaway-gateway
      sectionName: http-listener
  hostnames:
    - flyaway.capclouds.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flyaway-https-route
  namespace: default
spec:
  parentRefs:
    - name: flyaway-gateway
      sectionName: https-listener
  hostnames:
    - flyaway.capclouds.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: appflyaway-ingress-service
          port: 80
          weight: 1