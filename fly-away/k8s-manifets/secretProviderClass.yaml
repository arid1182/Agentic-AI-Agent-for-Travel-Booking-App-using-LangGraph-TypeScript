
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: flyaway-sp-class
  namespace: flyaway-namespace

spec:
  provider: azure
  secretObjects:
    - secretName: flyaway-secrets
      type: Opaque
      data:
        - objectName: NEXT_PUBLIC_OSRM_PROFILE
          key: NEXT_PUBLIC_OSRM_PROFILE

        - objectName: NEXT_PUBLIC_OSRM_BASE_URL
          key: NEXT_PUBLIC_OSRM_BASE_URL

        - objectName: PHOTON_API_REVERSE_URL
          key: PHOTON_API_REVERSE_URL

        - objectName: PHOTON_API_URL
          key: PHOTON_API_URL

        - objectName: OPENWEATHER_API_KEY
          key: OPENWEATHER_API_KEY

        - objectName: DUFFEL_VERSION
          key: DUFFEL_VERSION

        - objectName: DUFFEL_ACCESS_TOKEN
          key: DUFFEL_ACCESS_TOKEN

        - objectName: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY

        - objectName: NEXT_PUBLIC_SUPABASE_URL
          key: NEXT_PUBLIC_SUPABASE_URL

  parameters:
    usePodIdentity: "false"
    clientID: "17b3a136-24dc-42bc-a0c7-58f9cd5fedae"
    keyvaultName: "kv-aks-flyaway-20698" # the name of the KeyVault
    tenantId: "65a98dc0-7ee5-451c-9a05-61a30b4b9f48"

    objects: |
      array:
        - |
          objectName: NEXT-PUBLIC-OSRM-PROFILE
          objectAlias: NEXT_PUBLIC_OSRM_PROFILE
          objectType: secret

        - |
          objectName: NEXT-PUBLIC-OSRM-BASE-URL
          objectAlias: NEXT_PUBLIC_OSRM_BASE_URL
          objectType: secret

        - |
          objectName: PHOTON-API-REVERSE-URL
          objectAlias: PHOTON_API_REVERSE_URL
          objectType: secret

        - |
          objectName: PHOTON-API-URL
          objectAlias: PHOTON_API_URL
          objectType: secret

        - |
          objectName: OPENWEATHER-API-KEY
          objectAlias: OPENWEATHER_API_KEY
          objectType: secret

        - |
          objectName: DUFFEL-VERSION
          objectAlias: DUFFEL_VERSION
          objectType: secret

        - |
          objectName: DUFFEL-ACCESS-OKEN
          objectAlias: DUFFEL_ACCESS_TOKEN
          objectType: secret

        - |
          objectName: NEXT-PUBLIC-SUPABASE-PUBLISHABLE-KEY
          objectAlias: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          objectType: secret

        - |
          objectName: NEXT-PUBLIC-SUPABASE-URL
          objectAlias: NEXT_PUBLIC_SUPABASE_URL
          objectType: secret
